<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tsIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A24"/>
      <stop offset="100%" stop-color="#F58220"/>
    </linearGradient>
  </defs>
  <!-- Base Orange Squircle matching TrackScore branding -->
  <rect x="2" y="2" width="96" height="96" rx="22" ry="22" fill="url(#tsIconGrad)"/>
  <!-- Crisp Centered White TS Monogram -->
  <text x="50" y="54" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-1.5" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="central">TS</text>
</svg>
